}function trustRank(){const P_=DT.pers, G_=P_&&P_.glob;

sheet('이 결과, 얼마나 믿을 수 있나요?',

['podium',`상위 20% 적중률 ${B(pct(G_.top['20'][0]))}`,'상위 20%로 고른 단지가 실제로도 상위 20%에 든 비율 · 무작위 20%'],
['up',`중위 이상 상승 비율 ${B(pct(G_.top['20'][1]))}`,'상위 20%로 고른 단지가 실제로 중위 이상 상승한 비율 · 무작위 50%']].map(item).join('')
+grp('활용 방법')
+[['search','순위는 상위 후보군으로 활용하세요','미래 시세는 확정할 수 없어, 1위 한 곳보다 상위 여러 단지를 함께 비교할 때 판단의 정확도가 높아져요'],

+[['drop','시장 전체의 상승·하락은 예측하지 않아요','순위는 단지 사이의 상대 비교예요 — 시장 전체가 하락하는 시기에는 상위 단지도 함께 하락할 수 있어요'],
